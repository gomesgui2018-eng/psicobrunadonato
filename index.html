<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1a1620">
<title>PsicoBrunaDonato | Em breve</title>
<style>
html,body{height:100%;margin:0}
body{background:#1a1620;color:#f6f2ee;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden;position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;pointer-events:none;animation:drift 12s ease-in-out infinite alternate}
.a{width:320px;height:320px;background:#cbb9ea;top:-60px;right:0}
.b{width:260px;height:260px;background:#f2a070;bottom:-60px;left:0;animation-duration:16s}
@keyframes drift{to{transform:translate(40px,50px) scale(1.15)}}
main{position:relative;max-width:520px}
.logo{font-weight:700;font-size:20px;display:inline-flex;align-items:center;margin-bottom:28px}
.logo i{width:12px;height:12px;border-radius:50%;background:#f2a070;margin-right:8px;animation:p 2.4s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(242,160,112,.7)}100%{box-shadow:0 0 0 14px rgba(242,160,112,0)}}
h1{font-size:clamp(34px,8vw,56px);line-height:1.05;letter-spacing:-.03em;font-weight:500;margin:0 0 16px}
p{color:#b9b1bf;font-size:18px;line-height:1.55;margin:0 0 24px}
small{color:#b9b1bf;font-size:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="blob a"></div><div class="blob b"></div>
<main>
  <div class="logo"><i></i>PsicoBrunaDonato</div>
  <h1>Estamos preparando algo com carinho</h1>
  <p>O site da psicóloga Bruna Donato está em construção e volta em breve.</p>
  <small>Bruna Donato · Psicóloga · CRP 06/196820</small>
</main>
</body>
</html>
